<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的视频收藏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e8e8e8; min-height: 100vh;
  }
  header {
    text-align: center; padding: 56px 20px 36px;
    background: radial-gradient(ellipse at 50% -20%, #2a3f5f 0%, #0f1115 70%);
  }
  header h1 { font-size: 2rem; letter-spacing: 2px; margin-bottom: 10px; }
  header p { color: #9aa3b2; font-size: 0.95rem; }
  .grid {
    display: grid; gap: 28px; padding: 12px 24px 60px;
    max-width: 1100px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: #181c23; border-radius: 14px; overflow: hidden;
    cursor: pointer; transition: transform .2s, box-shadow .2s;
    border: 1px solid #262c36;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  .thumb { position: relative; aspect-ratio: 9/16; overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.25);
  }
  .play span {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #111; padding-left: 4px;
  }
  .duration {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(0,0,0,.75); padding: 3px 8px; border-radius: 6px; font-size: 12px;
  }
  .info { padding: 16px; }
  .info h2 { font-size: 1.02rem; margin-bottom: 8px; line-height: 1.4; }
  .info .date { color: #8b93a1; font-size: 0.82rem; margin-bottom: 8px; }
  .info p.desc { color: #b9c0cc; font-size: 0.86rem; line-height: 1.6; }
  .modal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.92); align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .modal video { max-height: 92vh; max-width: 94vw; border-radius: 10px; background: #000; }
  .close {
    position: absolute; top: 18px; right: 22px; font-size: 34px; color: #fff;
    cursor: pointer; line-height: 1; opacity: .8;
  }
  .close:hover { opacity: 1; }
  footer { text-align: center; color: #5c6470; font-size: 0.8rem; padding: 0 20px 40px; }
</style>
</head>
<body>

<header>
  <h1>🎬 我的视频收藏</h1>
  <p>每天的新鲜事，都在这里</p>
</header>

<main><div class="grid" id="grid"></div></main>

<div class="modal" id="modal">
  <div class="close" id="closeBtn">&times;</div>
  <video id="player" controls playsinline></video>
</div>

<footer>用 ❤️ 制作 · 每日更新</footer>

<script>
// ➕ 以后加新视频，只需在这里加一行：
const VIDEOS = [
  {
    title: "Claude 最新动态",
    date: "2026-10-10",
    duration: "2:18",
    desc: "Haiku 5.5 发布、动态工作流上线、Anthropic 新使用政策、IPO 传闻。",
    poster: "posters/claude-news-2026-10-10.jpg",
    src: "videos/claude-news-2026-10-10.mp4"
  },
  {
    title: "今日新闻速览",
    date: "2026-10-10",
    duration: "0:53",
    desc: "诺贝尔和平奖揭晓、俄乌冲突升级、巴拿马 7.6 级地震、中欧贸易协议。",
    poster: "posters/daily-news-2026-10-10.jpg",
    src: "videos/daily-news-2026-10-10.mp4"
  }
];

const grid = document.getElementById('grid');
const modal = document.getElementById('modal');
const player = document.getElementById('player');

VIDEOS.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb">
      <img src="${v.poster}" alt="${v.title}" loading="lazy">
      <div class="play"><span>▶</span></div>
      <div class="duration">${v.duration}</div>
    </div>
    <div class="info">
      <h2>${v.title}</h2>
      <div class="date">${v.date}</div>
      <p class="desc">${v.desc}</p>
    </div>`;
  card.onclick = () => { player.src = v.src; modal.classList.add('open'); player.play(); };
  grid.appendChild(card);
});

const closeModal = () => { player.pause(); player.removeAttribute('src'); player.load(); modal.classList.remove('open'); };
document.getElementById('closeBtn').onclick = closeModal;
modal.onclick = e => { if (e.target === modal) closeModal(); };
document.onkeydown = e => { if (e.key === 'Escape') closeModal(); };
</script>
</body>
</html>
